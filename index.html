<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>편제표 2차 점검 작업실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F6F8FB;--surface:#FFFFFF;--alt:#EEF2F7;--line:#D8E0EA;--ink:#18212C;--ink2:#4D5A69;--ink3:#7A8796;--accent:#00489A;--accent-ink:#FFFFFF;--soft:#E4EDF8;
--no:#B42318;--nobg:#FCE9E7;--ck:#94570A;--ckbg:#FBF0DC;--ok:#1E7A3A;--okbg:#E4F3E8;--adv:#6A3FB5;--advbg:#EFE8FA;
--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141B;--surface:#161D27;--alt:#1C2531;--line:#2B3746;--ink:#E7EDF4;--ink2:#A9B5C3;--ink3:#7F8C9B;--accent:#7FB3F0;--accent-ink:#0F141B;--soft:#1A2C44;--no:#F49A90;--nobg:#3A1D1A;--ck:#F0C06A;--ckbg:#3A2C13;--ok:#7FD39B;--okbg:#16301F;--adv:#C3A6F5;--advbg:#2B2140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141B;--surface:#161D27;--alt:#1C2531;--line:#2B3746;--ink:#E7EDF4;--ink2:#A9B5C3;--ink3:#7F8C9B;--accent:#7FB3F0;--accent-ink:#0F141B;--soft:#1A2C44;--no:#F49A90;--nobg:#3A1D1A;--ck:#F0C06A;--ckbg:#3A2C13;--ok:#7FD39B;--okbg:#16301F;--adv:#C3A6F5;--advbg:#2B2140;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
header.top{display:flex;flex-direction:column;gap:6px;padding:8px 0 14px}
.eyebrow{font-size:13px;color:var(--accent);font-weight:700}
h1{font-size:clamp(22px,5vw,28px);margin:0;font-weight:800}
h2{font-size:18px;margin:0}
h3{font-size:15.5px;margin:0}
.muted{color:var(--ink2);font-size:13.5px}
.tiny{color:var(--ink3);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:12px;align-items:end}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
select,input[type=text],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;margin:16px 0 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-no{background:var(--nobg);color:var(--no)}.p-ck{background:var(--ckbg);color:var(--ck)}.p-ok{background:var(--okbg);color:var(--ok)}.p-adv{background:var(--advbg);color:var(--adv)}.p-wt{background:var(--alt);color:var(--ink2)}.p-acc{background:var(--soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.sc{padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.sc:hover{border-color:var(--accent)}
.sc .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prog{height:6px;border-radius:3px;background:var(--alt);overflow:hidden}.prog>i{display:block;height:100%;background:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.notice{padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink);font-size:13.5px}
.notice.warn{background:var(--ckbg)}
.detail{display:flex;flex-direction:column;gap:14px}
.dhead{padding:14px;display:flex;flex-direction:column;gap:8px}
.sec{padding:14px;display:flex;flex-direction:column;gap:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--alt);color:var(--ink2);font-weight:500;font-size:12.5px;white-space:nowrap;position:sticky;top:0}
td.n{text-align:center;white-space:nowrap}
tr.gh td{background:var(--alt);font-weight:700;font-size:12.5px;color:var(--ink2)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.item.no{border-left:4px solid var(--no)}.item.ck{border-left:4px solid var(--ck)}
.item .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .d{font-size:13.5px;color:var(--ink2);white-space:pre-wrap}
.ctl{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:8px}
.chk{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px}
.chk label{display:flex;gap:6px;align-items:center;cursor:pointer}
.chk input{width:18px;height:18px}
.advbox{background:var(--advbg);border-radius:8px;padding:8px 10px;font-size:13.5px}
.saved{font-size:12px;color:var(--ink3)}
details.fold>summary{cursor:pointer;color:var(--ink2);font-size:13.5px;padding:4px 0}
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.xl{max-height:520px;overflow:auto}
.xl table td{white-space:nowrap}
.hide{display:none!important}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.kv b{color:var(--ink)}
ol.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){.login{grid-template-columns:1fr 1fr}.login .btn{grid-column:1/-1}.ctl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="eyebrow">2027학년도 고등학교 신입생 교육과정 편제표 점검</div>
  <h1>편제표 2차 점검 작업실</h1>
  <p class="muted" id="asof"></p>
</header>

<section class="card login" aria-label="위원 선택">
  <label>위원<select id="who"><option value="">이름 선택</option></select></label>
  <label>확인 코드(4자리)<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="단톡방 안내 코드"></label>
  <button class="btn pri" id="go">시작</button>
</section>
<p class="tiny" id="conn" style="margin:6px 2px 0"></p>

<nav class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" data-v="mine" aria-selected="true">내 담당 학교</button>
  <button class="tab" role="tab" data-v="adv">직업계 자문</button>
  <button class="tab" role="tab" data-v="all">전체 진행</button>
  <button class="tab" role="tab" data-v="guide">점검 안내</button>
</nav>

<main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
